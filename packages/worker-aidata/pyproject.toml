[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worker-aidata"
version = "0.1.0"
description = "AI Data worker — migrated from ai-data-os into ai-xyc monorepo"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "xiaoyanchao" }]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openai>=1.40",
    "bcrypt>=4.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlglot>=25",
    "pymysql>=1.1",
    "dbutils>=3.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pymilvus>=2.4",
    "sentence-transformers>=3.1",
    "neo4j>=5.25",
    "redis>=5.1",
    "elasticsearch>=8.15",
    "langfuse>=2.51",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-jose[cryptography]>=3.3",
    "jedi>=0.20.0",
    "GitPython>=3.1.0",
    "networkx>=3.0",
    "mcp>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "requests>=2.31",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
]

[tool.setuptools]
packages = [
    "config",
    "gateway",
    "gateway.routes",
    "gateway.models",
    "llm",
    "observability",
    "catalog",
    "retrieval",
    "retrieval.graph",
    "retrieval.rag",
    "sql_engine",
    "dag_engine",
    "dag_engine.nodes",
    "semantic",
    "semantic.compiler",
    "semantic.registry",
    "semantic.router",
    "mcp_server",
    "security",
    "learning",
    "knowledge",
    "fusion",
    "database",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]
